<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SutraDhar — an AI assistant for capturing and managing work." />

    <!-- PWA: installable to home screen / desktop, launches without browser chrome -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e2025" />
    <!-- iOS "Add to Home Screen": opaque touch icon + standalone chrome -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SutraDhar" />
    <title>SutraDhar</title>
    <script>
      // TEMPORARY: the app is dark-only during the ClickUp dark-mode build, so apply
      // `dark` unconditionally before first paint (no flash, no light fallback). To
      // restore themed behaviour, revert this to read the saved theme and set
      // FORCE_DARK = false in ThemeProvider.
      document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
